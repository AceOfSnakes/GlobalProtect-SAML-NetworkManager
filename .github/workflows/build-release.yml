name: Build and Release

on:
  push:
    tags:
      - "v*"
  # Build every package on pull requests as a check. Nothing is released or
  # published: release and publish-apt run only for tags.
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      ubuntu_version:
        description: "Ubuntu version to build"
        required: true
        default: "24.04"
        type: choice
        options:
          - "22.04"
          - "24.04"
          - "24.10"
          - "26.04"
          - "all"

# Read-only by default (pull requests run the build); only the release job
# gets write access.
permissions:
  contents: read

# A new push to a pull request cancels the superseded build. Tag and manual
# runs are never cancelled: a release must run to the end.
concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Docker builds natively on each runner (no QEMU): the arm64 runner produces
    # arm64 packages, the amd64 one amd64 packages.
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        # Only a manual run can pick one version; tags and pull requests build all.
        ubuntu: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.ubuntu_version == 'all' && fromJSON('["22.04", "24.04", "24.10", "26.04"]') || fromJSON(format('["{0}"]', github.event.inputs.ubuntu_version))) || fromJSON('["22.04", "24.04", "24.10", "26.04"]') }}
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Debian packages
        run: |
          set -e

          # Build Docker image
          docker build -t gpclient-builder:ubuntu${{ matrix.ubuntu }} \
            -f Dockerfile.ubuntu${{ matrix.ubuntu }} .

          # Create output directory with write permissions for all users
          mkdir -p output/ubuntu${{ matrix.ubuntu }}-${{ matrix.arch }}
          chmod 777 output/ubuntu${{ matrix.ubuntu }}-${{ matrix.arch }}

          # Run build (fail on error)
          # WORKDIR is /build/source, so ".." = /build where dpkg-buildpackage writes .deb files
          docker run --rm \
            -v ${{ github.workspace }}/output/ubuntu${{ matrix.ubuntu }}-${{ matrix.arch }}:/output \
            gpclient-builder:ubuntu${{ matrix.ubuntu }} \
            bash -c "
              set -e
              cp debian/control.ubuntu${{ matrix.ubuntu }} debian/control
              # Tag the version with the release codename (1.4.0-1~noble1) so the
              # same version never means different binaries and apt sees a reason
              # to reinstall after a distribution upgrade. The apt repository
              # derives the suite from this suffix (.github/scripts/build-apt-repo.sh).
              . /etc/os-release
              sed -i \"1s/(\\([^)]*\\))/(\\1~\${VERSION_CODENAME}1)/\" debian/changelog
              echo \"Building version \$(dpkg-parsechangelog -S Version) for \$VERSION_CODENAME\"
              dpkg-buildpackage -us -uc -b
              cp /build/*.deb /build/*.ddeb /output/ 2>/dev/null || cp /build/*.deb /output/
            "

      - name: Verify .deb files exist
        run: |
          if ! ls output/ubuntu${{ matrix.ubuntu }}-${{ matrix.arch }}/*.deb 1>/dev/null 2>&1; then
            echo "ERROR: No .deb files produced!"
            exit 1
          fi
          # A wrong-architecture .deb would land in the wrong apt Packages index
          for deb in output/ubuntu${{ matrix.ubuntu }}-${{ matrix.arch }}/*.deb; do
            deb_arch=$(dpkg-deb -f "$deb" Architecture)
            if [ "$deb_arch" != "${{ matrix.arch }}" ]; then
              echo "ERROR: $deb has Architecture '$deb_arch', expected '${{ matrix.arch }}'"
              exit 1
            fi
          done
          echo "Built packages:"
          ls -la output/ubuntu${{ matrix.ubuntu }}-${{ matrix.arch }}/*.deb

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debs-ubuntu-${{ matrix.ubuntu }}-${{ matrix.arch }}
          path: output/ubuntu${{ matrix.ubuntu }}-${{ matrix.arch }}/*.deb

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        run: |
          # Filenames already carry the release codename in the version
          # and the architecture (network-manager-gpclient_1.4.0-1~noble1_amd64.deb),
          # so no renaming is needed to keep them unique across all builds.
          mkdir -p release-files
          find artifacts -name '*.deb' -exec cp {} release-files/ \;
          echo "Release files:"
          ls -la release-files/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*.deb
          generate_release_notes: true
          fail_on_unmatched_files: true

  publish-apt:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish-apt.yml
    secrets: inherit
