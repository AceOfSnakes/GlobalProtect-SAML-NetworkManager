name: Build and Release

on:
  push:
    tags:
      - "v*"
  # Build every package on pull requests as a check. Nothing is released or
  # published: release and publish-apt run only for tags.
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      ubuntu_version:
        description: "Ubuntu version to build"
        required: true
        default: "24.04"
        type: choice
        options:
          - "22.04"
          - "24.04"
          - "24.10"
          - "26.04"
          - "all"

# Read-only by default (pull requests run the build); only the release job
# gets write access.
permissions:
  contents: read

# A new push to a pull request cancels the superseded build. Tag, manual and
# main runs are never cancelled: a release must run to the end. GitHub keeps
# one pending run per group and drops the older one even without
# cancel-in-progress, so those runs get their own group.
concurrency:
  group: build-release-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Docker builds natively on each runner (no QEMU): the arm64 runner produces
    # arm64 packages, the amd64 one amd64 packages.
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        # Only a manual run can pick one version; tags and pull requests build all.
        ubuntu: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.ubuntu_version == 'all' && fromJSON('["22.04", "24.04", "24.10", "26.04"]') || fromJSON(format('["{0}"]', github.event.inputs.ubuntu_version))) || fromJSON('["22.04", "24.04", "24.10", "26.04"]') }}
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Debian packages
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -e

          # A pull request's packages get a version above the release's one
          # (1.4.2-1~noble1+pr24.57 sorts after 1.4.2-1~noble1), or installing
          # them over the released version would be a no-op for apt. Only
          # numbers go into it, checked here.
          pr_suffix=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,6}$ && "$RUN_NUMBER" =~ ^[1-9][0-9]{0,9}$ ]]; then
              echo "ERROR: unexpected pull request or run number: '$PR_NUMBER' '$RUN_NUMBER'"
              exit 1
            fi
            pr_suffix="+pr${PR_NUMBER}.${RUN_NUMBER}"
          fi

          ubuntu="${{ matrix.ubuntu }}"
          arch="${{ matrix.arch }}"
          out="output/ubuntu${ubuntu}-${arch}"

          # Create output directory with write permissions for all users
          mkdir -p "$out"
          chmod 777 "$out"

          # build_packages <image name> <Dockerfile> <control file>: build the
          # image, then the packages in it. A fresh container per build: only
          # its own .deb files are in /build and get copied to the output
          # directory (fail on error).
          build_packages() {
            local name="$1" dockerfile="$2" control="$3"
            echo "Building $name from $dockerfile and $control"
            docker build -t "gpclient-builder:$name" -f "$dockerfile" .

            # WORKDIR is /build/source, so ".." = /build where dpkg-buildpackage writes .deb files
            docker run --rm -e PR_SUFFIX="$pr_suffix" -e CONTROL="$control" \
              -v "${{ github.workspace }}/$out:/output" \
              "gpclient-builder:$name" \
              bash -c '
                set -e
                cp "$CONTROL" debian/control
                # Tag the version with the release codename (1.4.0-1~noble1) so the
                # same version never means different binaries and apt sees a reason
                # to reinstall after a distribution upgrade. The apt repository
                # derives the suite from this suffix (.github/scripts/build-apt-repo.sh).
                # Pull requests add +pr<PR>.<run> (PR_SUFFIX, empty otherwise).
                . /etc/os-release
                sed -i "1s/(\([^)]*\))/(\1~${VERSION_CODENAME}1${PR_SUFFIX})/" debian/changelog
                echo "Building version $(dpkg-parsechangelog -S Version) for $VERSION_CODENAME"
                dpkg-buildpackage -us -uc -b
                cp /build/*.deb /build/*.ddeb /output/ 2>/dev/null || cp /build/*.deb /output/
              '
          }

          # The architectures a variant is built for. A variant is
          # Dockerfile.ubuntu<version>-<variant> together with
          # debian/control.ubuntu<version>-<variant>: it builds more packages of
          # the same release into the same directory, after the main build.
          variant_arches() {
            case "$1" in
              # KDE neon (Ubuntu 24.04 with Plasma 6): plasma-nm, which the
              # plugin is linked against, is not in its arm64 repository
              neon) echo amd64 ;;
              *) return 1 ;;
            esac
          }

          build_packages "ubuntu$ubuntu" "Dockerfile.ubuntu$ubuntu" "debian/control.ubuntu$ubuntu"

          mapfile -t variants < <(for file in Dockerfile.ubuntu${ubuntu}-* debian/control.ubuntu${ubuntu}-*; do
            [ -e "$file" ] && echo "${file##*ubuntu${ubuntu}-}"
          done | sort -u)
          for variant in "${variants[@]}"; do
            if ! [[ "$variant" =~ ^[a-z0-9]+$ ]]; then
              echo "::error::unexpected name of a build variant: '$variant'"
              exit 1
            fi
            dockerfile="Dockerfile.ubuntu${ubuntu}-${variant}"
            control="debian/control.ubuntu${ubuntu}-${variant}"
            if ! [ -f "$dockerfile" ] || ! [ -f "$control" ]; then
              echo "::warning::variant $variant of Ubuntu $ubuntu needs both $dockerfile and $control: not built"
              continue
            fi
            if ! arches=$(variant_arches "$variant"); then
              echo "::error::variant $variant has no list of architectures in variant_arches"
              exit 1
            fi
            case " $arches " in
              *" $arch "*) build_packages "ubuntu${ubuntu}-${variant}" "$dockerfile" "$control" ;;
              *) echo "Variant $variant is built for $arches only, not for $arch" ;;
            esac
          done

      - name: Verify .deb files exist
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if ! ls output/ubuntu${{ matrix.ubuntu }}-${{ matrix.arch }}/*.deb 1>/dev/null 2>&1; then
            echo "ERROR: No .deb files produced!"
            exit 1
          fi
          # A wrong-architecture .deb would land in the wrong apt Packages index
          for deb in output/ubuntu${{ matrix.ubuntu }}-${{ matrix.arch }}/*.deb; do
            deb_arch=$(dpkg-deb -f "$deb" Architecture)
            if [ "$deb_arch" != "${{ matrix.arch }}" ]; then
              echo "ERROR: $deb has Architecture '$deb_arch', expected '${{ matrix.arch }}'"
              exit 1
            fi
          done
          # The version ends in ~<codename>1 (build-apt-repo.sh reads the suite
          # from it), for a pull request followed by +pr<PR>.<run> (what
          # scripts/install-pr-build.sh expects), and never on a release build
          if [ "$EVENT_NAME" = "pull_request" ]; then
            version_re="~[a-z]+1[+]pr${PR_NUMBER}[.]${RUN_NUMBER}$"
          else
            version_re='~[a-z]+1$'
          fi
          for deb in output/ubuntu${{ matrix.ubuntu }}-${{ matrix.arch }}/*.deb; do
            deb_version=$(dpkg-deb -f "$deb" Version)
            if ! [[ "$deb_version" =~ $version_re ]]; then
              echo "ERROR: $deb has version '$deb_version', expected it to match '$version_re'"
              exit 1
            fi
          done
          echo "Built packages:"
          ls -la output/ubuntu${{ matrix.ubuntu }}-${{ matrix.arch }}/*.deb

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debs-ubuntu-${{ matrix.ubuntu }}-${{ matrix.arch }}
          path: output/ubuntu${{ matrix.ubuntu }}-${{ matrix.arch }}/*.deb

      - name: Upgrade test from the last release
        # Not for tags (the only push trigger): a network flake in a check must
        # not block a release. Installs the newest release from the public apt
        # repository in a fresh ubuntu container and upgrades it to the
        # packages built above (see
        # .github/scripts/upgrade-test.sh). Every scenario runs; the step fails
        # at the end if any of them failed. The neon scenario (KDE neon, the
        # Ubuntu 24.04 variant with Plasma 6) skips itself where no such
        # package was built. The containers write the GUI smoke test
        # screenshots to gui-smoke/, uploaded by the next step.
        if: github.event_name != 'push'
        env:
          UBUNTU: ${{ matrix.ubuntu }}
          ARCH: ${{ matrix.arch }}
        run: |
          failed=""
          mkdir -p "$PWD/gui-smoke"
          for scenario in gnome plasma neon; do
            echo "::group::Upgrade test: $scenario"
            if ! docker run --rm \
                -v "$PWD/output/ubuntu${UBUNTU}-${ARCH}:/debs:ro" \
                -v "$PWD/.github/scripts:/scripts:ro" \
                -v "$PWD/gui-smoke:/out" \
                "ubuntu:${UBUNTU}" bash /scripts/upgrade-test.sh "$scenario" /debs /out; then
              failed="$failed $scenario"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::Upgrade test failed for:$failed"
            exit 1
          fi

      - name: Upload GUI screenshots
        # Screenshots of the connection editor from the upgrade test (see
        # .github/scripts/gui-smoke.sh); also kept when that test failed. Not
        # for tags, like the test.
        if: always() && github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: gui-smoke-ubuntu-${{ matrix.ubuntu }}-${{ matrix.arch }}
          path: gui-smoke/*.png
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        run: |
          # Filenames already carry the release codename in the version
          # and the architecture (network-manager-gpclient_1.4.0-1~noble1_amd64.deb),
          # so no renaming is needed to keep them unique across all builds.
          mkdir -p release-files
          find artifacts -name '*.deb' -exec cp {} release-files/ \;
          echo "Release files:"
          ls -la release-files/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*.deb
          generate_release_notes: true
          fail_on_unmatched_files: true

  # Separate from "release" and not a dependency of publish-apt: a failure here
  # (the notes are only a convenience) never blocks the apt repository.
  release-notes:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: true

      - name: Add downloads table to the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # Merged between markers: a rerun replaces only the table and keeps the
          # generated notes and the edits made before this job runs.
          gh release view "$TAG" --repo "$REPO" --json assets,body > release.json
          python3 .github/scripts/release_notes.py --repo "$REPO" --tag "$TAG" --release-json release.json > new-body.md
          gh release edit "$TAG" --repo "$REPO" --notes-file new-body.md

  publish-apt:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish-apt.yml
    secrets: inherit
