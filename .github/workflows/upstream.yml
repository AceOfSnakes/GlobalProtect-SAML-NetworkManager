name: Upstream contract

# Checks the pinned upstream (external/GlobalProtect-openconnect) against
# upstream/contract.json and upstream/features.json, and makes a breaking
# change wait for a human verification. See docs/UPSTREAM.md.
#
# `labeled` and `unlabeled` re-run the check, so adding the label
# `upstream-verified` turns the check green without a new push.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Only a new push to a pull request cancels the superseded run: see tests.yml.
concurrency:
  group: upstream-contract-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  upstream:
    name: Upstream contract
    runs-on: ubuntu-latest

    steps:
      # The top-level submodule only: the checks read upstream sources, they
      # build nothing, so the nested submodules are not needed.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      # The pin is a release tag: the tests check that the tag resolves to the
      # commit that is checked out. The tag is read from the contract.
      - name: Fetch the pinned upstream tag
        run: |
          TAG=$(python3 -c 'import json; print(json.load(open("upstream/contract.json"))["tag"])')
          git -C external/GlobalProtect-openconnect fetch --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Check the pinned upstream
        run: python -m pytest tests/upstream -q -p no:cacheprovider

      # Compared with the contract of the base branch, not with the one of the
      # pull request: a pull request cannot hide a breaking change by editing
      # its own contract. The label list is passed through the environment,
      # never into the script text.
      - name: Gate breaking upstream changes
        if: always() && github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          git fetch --depth=1 origin "$BASE_REF"
          BASE="$RUNNER_TEMP/base-contract.json"
          if git show FETCH_HEAD:upstream/contract.json > "$BASE" 2>/dev/null; then
            echo "Base contract: $BASE_REF"
          else
            : > "$BASE"
            echo "The base branch has no upstream/contract.json"
          fi
          python scripts/upstream_contract.py gate --base-contract "$BASE" --labels "$LABELS"
