# Tool configuration only (no packaging). Run with `make lint`.

[tool.ruff]
target-version = "py310"
exclude = ["external"]

[tool.ruff.lint]
select = ["F", "B", "ASYNC", "E722", "S"]
ignore = [
    # Every subprocess call here runs a fixed argv list without a shell, and
    # uses the bare name of a system tool on purpose (PATH of the system, or
    # the fake PATH of a test).
    "S603",
    "S607",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",  # assert is how pytest tests check things
    "S108",  # tests use fixed /tmp-like paths as data for fake tools
    "S105",  # fake passwords and secrets as test data
    "S106",
    "S107",
    "S103",  # tests set modes on files they create in a temp dir
    "S104",  # "0.0.0.0" appears as test data
]

[tool.mypy]
files = ["service/nm-gpclient-service.py", "auth-dialog/nm-gpclient-auth-dialog.py"]
python_version = "3.10"
ignore_missing_imports = true  # sdbus, gi: not installed in CI
disable_error_code = ["annotation-unchecked"]  # notes about untyped bodies; not --check-untyped-defs
